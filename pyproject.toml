
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "docuchat"
version = "0.1.0"
description = "Ask questions about PDF documents using AI"
requires-python = ">=3.11,<3.14"
dependencies = [
    "streamlit>=1.40,<2.0",
    "pymupdf>=1.24,<2.0",
    "sentence-transformers>=3.0,<6.0",
    "faiss-cpu>=1.8,<2.0",
    "google-genai>=1.0,<2.0",
    "python-dotenv>=1.0,<2.0",
]

[tool.setuptools]
py-modules = [
    "app",
    "pdf_processor",
    "chunking",
    "vector_store",
    "llm_service",
]
