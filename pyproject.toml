
[build-system]
requires = ["setuptools>=68,<82", "wheel>=0.42,<1"]
build-backend = "setuptools.build_meta"

[project]
name = "docuchat"
version = "0.1.0"
description = "Chat with PDF documents using AI"
requires-python = ">=3.11,<3.14"
dependencies = [
    "streamlit>=1.40,<2.0",
    "pymupdf>=1.24,<2.0",
    "sentence-transformers>=3.0,<7.0",
    "faiss-cpu>=1.9,<2.0",
    "google-genai>=1.0,<3.0",
    "python-dotenv>=1.0,<2.0",
    "openai>=1.60,<3.0",
    "groq>=0.13,<2.0",
]

[tool.setuptools]
py-modules = [
    "app",
    "pdf_processor",
    "chunking",
    "vector_store",
    "llm_service",
]
